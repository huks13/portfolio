<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" style="font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><rect width="1000" height="380" fill="#fff"/><defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#2E74B5"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#3C8C3C"/></marker></defs><rect x="15" y="75" width="210" height="150" rx="11" fill="#1F3864" stroke="#1F3864" stroke-width="2"/><text x="120" y="113" font-size="23" fill="#fff" text-anchor="middle" font-weight="700">카메라 PC</text><text x="120" y="145" font-size="18" fill="#fff" text-anchor="middle">엣지 AI 인식</text><text x="120" y="172" font-size="16" fill="#D2E1F5" text-anchor="middle">칸 점유 · 번호 · 색</text><text x="120" y="195" font-size="15" fill="#D2E1F5" text-anchor="middle">(실물 2곳 · 28칸)</text><line x1="225" y1="150" x2="305" y2="150" stroke="#2E74B5" stroke-width="4" marker-end="url(#ar)"/><text x="267" y="115" font-size="15" fill="#D6601E" text-anchor="middle" font-weight="700">관측 전송</text><text x="267" y="190" font-size="13" fill="#5A5A5A" text-anchor="middle">인식 결과만</text><rect x="310" y="35" width="360" height="240" rx="11" fill="#E8F0FA" stroke="#2E74B5" stroke-width="4"/><rect x="575" y="20" width="90" height="28" rx="9" fill="#D6601E"/><text x="620" y="40" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">내 담당</text><text x="490" y="70" font-size="22" fill="#1F3864" text-anchor="middle" font-weight="700">FastAPI 서버 · SQLite</text><text x="330" y="105" font-size="16.5" fill="#1E1E1E" text-anchor="start">① 관측 검증: 토큰·형식·시각·중복</text><text x="330" y="141" font-size="16.5" fill="#1E1E1E" text-anchor="start">② 상태 확정: 점유 2초 / 빈칸 3초</text><text x="330" y="177" font-size="16.5" fill="#1E1E1E" text-anchor="start">③ 입출차 세션: active → closed</text><text x="330" y="213" font-size="16.5" fill="#1E1E1E" text-anchor="start">④ 번호 자동 연결 · 칸 이동 세션 유지</text><text x="330" y="249" font-size="16.5" fill="#1E1E1E" text-anchor="start">⑤ 조회 API: 칸 · 차량 위치 · 세션</text><rect x="770" y="35" width="215" height="70" rx="11" fill="#fff" stroke="#2E74B5" stroke-width="2.5"/><text x="877" y="65" font-size="18" fill="#1F3864" text-anchor="middle" font-weight="700">사용자 모바일 웹</text><text x="877" y="90" font-size="14.5" fill="#5A5A5A" text-anchor="middle">빈자리 · 내 차 · 요금</text><line x1="670" y1="70" x2="764" y2="70" stroke="#2E74B5" stroke-width="4" marker-end="url(#ar)"/><rect x="770" y="120" width="215" height="70" rx="11" fill="#fff" stroke="#2E74B5" stroke-width="2.5"/><text x="877" y="150" font-size="18" fill="#1F3864" text-anchor="middle" font-weight="700">관리자 통합 관제</text><text x="877" y="175" font-size="14.5" fill="#5A5A5A" text-anchor="middle">현황 · 경보 · 매출</text><line x1="670" y1="155" x2="764" y2="155" stroke="#2E74B5" stroke-width="4" marker-end="url(#ar)"/><rect x="770" y="205" width="215" height="70" rx="11" fill="#fff" stroke="#2E74B5" stroke-width="2.5"/><text x="877" y="235" font-size="18" fill="#1F3864" text-anchor="middle" font-weight="700">LLM 챗봇</text><text x="877" y="260" font-size="14.5" fill="#5A5A5A" text-anchor="middle">조회 결과로만 답변</text><line x1="670" y1="240" x2="764" y2="240" stroke="#2E74B5" stroke-width="4" marker-end="url(#ar)"/><rect x="350" y="310" width="280" height="60" rx="11" fill="#ECF6EC" stroke="#3C8C3C" stroke-width="2.5"/><text x="490" y="336" font-size="18" fill="#286E28" text-anchor="middle" font-weight="700">가상 주차장 시뮬레이터</text><text x="490" y="360" font-size="14" fill="#5A5A5A" text-anchor="middle">2곳 · 128칸 (같은 규격으로 전송)</text><line x1="490" y1="310" x2="490" y2="281" stroke="#3C8C3C" stroke-width="4" marker-end="url(#ag)"/></svg>